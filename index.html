<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Стратегии простыми словами</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23191919'/%3E%3Ctext x='20' y='28' text-anchor='middle' font-family='Georgia,serif' font-size='26' fill='%23d97757'%3E%CF%83%3C/text%3E%3C/svg%3E">
  <link rel="preload" href="fonts/AnthropicInterface-Roman.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/StyreneBLC-Regular-Tight.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/AnthropicSerif-Roman.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('se-theme');
        document.documentElement.setAttribute('data-theme', t === 'classic' ? 'classic' : 'claude');
      } catch (_) {
        document.documentElement.setAttribute('data-theme', 'claude');
      }
    })();
  </script>
</head>
<body>
  <header class="top">
    <div class="brand-group">
      <div class="brand">
        <div class="logo">σ</div>
        <div>
          <div class="brand-title">Стратегии простыми словами</div>
          <div class="brand-sub">Спред-арбитраж на срочном рынке</div>
        </div>
      </div>
    </div>
    <nav id="strategies" class="strategies" aria-label="Стратегии"></nav>
    <div id="theme-switch" class="theme-switch">
      <button type="button" class="theme-trigger" aria-haspopup="menu" aria-expanded="false" aria-controls="theme-menu" title="Тема оформления" aria-label="Тема оформления">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M8 1.8a6.2 6.2 0 0 1 0 12.4z" fill="currentColor" stroke="none"/></svg>
      </button>
      <div id="theme-menu" class="theme-menu" role="menu" aria-label="Тема оформления">
        <div class="theme-menu-title" aria-hidden="true">Тема</div>
        <button type="button" role="menuitemradio" data-theme-val="claude" title="Тёмная тема в стиле чата Claude">
          <span class="swatch claude" aria-hidden="true"></span>Claude<svg class="check" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>
        </button>
        <button type="button" role="menuitemradio" data-theme-val="classic" title="Исходная классическая тема">
          <span class="swatch classic" aria-hidden="true"></span>Классика<svg class="check" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside id="steps" class="steps" aria-label="Экраны"></aside>
    <main id="screen" class="screen"></main>
  </div>

  <div id="glossary-tip" class="glossary-tip" hidden></div>

  <script src="js/engine.js"></script>

  <script src="js/charts.js"></script>
  <script src="js/hedge-viz.js"></script>

  <script src="js/screens-spreads.js"></script>
  <script src="js/screens-basics.js"></script>

  <script src="js/screens-risk.js"></script>

  <script src="js/screens-hedge-practice.js"></script>

  <script src="js/router.js"></script>
</body>
